version: '2.4'

services:
  jenkins:
    image: jenkins/jenkins:2.440.2-lts
    restart: unless-stopped
    user: jenkins

    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50000:50000"

    environment:
      - JAVA_OPTS=-Xmx1536m

    volumes:
      - jenkins-home:/var/jenkins_home

    cpus: 1.0
    mem_limit: 2048m

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - jenkins-net

volumes:
  jenkins-home:
    driver: local

networks:
  jenkins-net:
    driver: bridge
