version: '3.8'

services:
  archiva:
    image: xetusoss/archiva:latest
    container_name: archiva
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"
    
    environment:
      - JAVA_OPTS=-Xms1g -Xmx2g

    volumes:
      - archiva-data:/archiva-data
      - archiva-logs:/archiva-logs
      - archiva-conf:/archiva-conf

    # Resource limits for stability
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

    # Health check to monitor container status
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  archiva-data:
    driver: local
  archiva-logs:
    driver: local
  archiva-conf:
    driver: local