version: '2.4'

services:
  archiva:
    image: xetusoss/archiva:2.3.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m

    volumes:
      - archiva-data:/archiva-data
      - archiva-logs:/archiva-logs
      - archiva-conf:/archiva-conf

    cpus: 0.75
    mem_limit: 1536m

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - archiva-net

volumes:
  archiva-data:
    driver: local
  archiva-logs:
    driver: local
  archiva-conf:
    driver: local

networks:
  archiva-net:
    driver: bridge