services:
  archiva:
    image: xetusoss/archiva:latest
    container_name: archiva
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"
    
    environment:
      - JAVA_OPTS=-Xms1g -Xmx2g

    volumes:
      - /opt/archiva/data:/archiva-data
      - /opt/archiva/logs:/archiva-logs
      - /opt/archiva/conf:/archiva-conf